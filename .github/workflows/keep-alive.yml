name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "https://mkcbufuhovbctlmzbtxn.supabase.co/rest/v1/chains?select=id&limit=1" \
            -H "apikey: sb_publishable_GRKftC0d-gyiFVvHC1DFkw_chP7WCEs" \
            -H "Authorization: Bearer sb_publishable_GRKftC0d-gyiFVvHC1DFkw_chP7WCEs")
          echo "HTTP status: $code"
          test "$code" = "200"
